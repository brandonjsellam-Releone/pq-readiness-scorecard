name: 'TRELYAN Post-Quantum Readiness Scorecard'
description: 'Scan your repo for quantum-vulnerable crypto: A–F readiness grade + CycloneDX CBOM, and fail the build on broken crypto.'
author: 'TRELYAN'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Comma-separated risk classes that fail the build (e.g. broken-classical,quantum-broken)'
    required: false
    default: 'broken-classical'
  min-grade:
    description: 'Minimum acceptable grade (A–F); build fails below it. Empty = no grade gate.'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated path globs to exclude (e.g. test-fixtures/,examples/,**/*.golden). Also readable from .pqcbomignore lines containing "/" or prefixed "path:". Excluded paths are counted in the step summary, never silently dropped.'
    required: false
    default: ''
  strict:
    description: 'Ignore the in-tree .pqcbomignore entirely. That file is read from INSIDE the scanned tree, so on a gating push/pull_request workflow its suppression rules are supplied by the code under review. Recommended (true) whenever this Action gates a build. The workflow-level `exclude` input still applies.'
    required: false
    default: 'false'
outputs:
  grade:
    description: 'Post-Quantum Readiness grade (A–F)'
  score:
    description: 'Post-Quantum Readiness score (0–100)'
  sarif-file:
    description: 'Path to the SARIF 2.1.0 report (upload via github/codeql-action/upload-sarif to populate the Security tab)'
  cbom-file:
    description: 'Path to the CycloneDX CBOM (cbom.cdx.json)'
runs:
  using: 'node20'
  main: 'run.mjs'
