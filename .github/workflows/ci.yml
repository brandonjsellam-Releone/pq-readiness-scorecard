name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch Node-runtime drift on an otherwise dormant repo

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test (152 assertions)
        run: node pqcbom.mjs
      - name: Smoke — scanner produces CBOM/SARIF artifacts (no policy gate)
        env:
          INPUT_PATH: examples
          INPUT_FAIL-ON: ""
        run: |
          node run.mjs
          test -s cbom.cdx.json
          test -s pqcbom.sarif

      # Neither step above executes policyGate, which is the Action's entire security
      # function: `grep -c policyGate pqcbom.mjs` is 0, so the 152-assertion self-test never
      # reaches action-lib.mjs, and the smoke step sets INPUT_FAIL-ON to "" so run.mjs's
      # `if (failOn.length || minGrade)` branch is dead. examples/ holds one workflow file and
      # zero crypto. Demonstrated: replacing `const all = configErrors.concat(violations)` in
      # action-lib.mjs with `const all = []` - a gate that can never fail - leaves both steps
      # green.
      #
      # Both directions are required. A gate that rejects everything passes the first of these
      # and fails the second; only the pair shows it discriminates.
      - name: Policy gate must FAIL on classically-broken crypto
        env:
          INPUT_PATH: fixtures/broken
          INPUT_FAIL-ON: broken-classical
        run: |
          if node run.mjs; then
            echo "::error::the policy gate passed a fixture full of MD5/SHA-1/RC4/3DES/TLS1.0"
            exit 1
          fi
          echo "gate correctly failed the broken fixture"

      - name: Policy gate must PASS clean crypto, including quantum-broken-but-not-classical
        env:
          INPUT_PATH: fixtures/clean
          INPUT_FAIL-ON: broken-classical
        run: |
          node run.mjs
          echo "gate correctly passed the clean fixture"
