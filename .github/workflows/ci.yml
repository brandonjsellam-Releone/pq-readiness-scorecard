name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch Node-runtime drift on an otherwise dormant repo

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test (including FAIL-TEST refuse-to-grade mutations)
        run: node pqcbom.mjs
      - name: Smoke — scanner produces CBOM/SARIF artifacts (no policy gate)
        env:
          INPUT_PATH: fixtures/clean
          INPUT_FAIL-ON: ""
        run: |
          node run.mjs
          test -s cbom.cdx.json
          test -s pqcbom.sarif
          # A named gate that cannot fail is a defect: this path has crypto, so it must grade, not refuse.
          test -s pq-readiness-badge.json
          ! grep -q '"ungraded"' pq-readiness-badge.json

      # gradeOf fail-closed: empty / unrecognized must be observed to FAIL (not A/100).
      # examples/ is a workflow YAML with no cryptographic patterns — unrecognized input.
      - name: Refuse to grade unrecognized input (not A/100)
        env:
          INPUT_PATH: examples
          INPUT_FAIL-ON: ""
        run: |
          rm -f pq-readiness-badge.json cbom.cdx.json pqcbom.sarif
          if node run.mjs; then
            echo "::error::unrecognized tree was accepted as a grade (gate cannot fail)"
            exit 1
          fi
          if [ -f pq-readiness-badge.json ]; then
            echo "::error::refused scan still wrote a badge (must not paint A/100)"
            exit 1
          fi
          echo "Action correctly refused unrecognized input"

      - name: Refuse to grade an empty tree (not A/100)
        env:
          INPUT_PATH: /tmp/pqcbom-empty-scan
          INPUT_FAIL-ON: ""
        run: |
          mkdir -p /tmp/pqcbom-empty-scan
          rm -f pq-readiness-badge.json cbom.cdx.json pqcbom.sarif
          if node run.mjs; then
            echo "::error::empty tree graded instead of refused"
            exit 1
          fi
          if [ -f pq-readiness-badge.json ]; then
            echo "::error::refused empty scan still wrote a badge (must not paint A/100)"
            exit 1
          fi
          echo "Action correctly refused empty tree"

      # policyGate still needs both directions on REAL crypto (the refuse steps above
      # prove empty/unrecognized fail closed; they do not prove the severity filter works).
      # A gate that rejects everything passes the first of these and fails the second;
      # only the pair shows it discriminates. Demonstrated: `const all = []` in
      # action-lib.mjs makes the broken fixture go green while this pair goes red.
      - name: Policy gate must FAIL on classically-broken crypto
        env:
          INPUT_PATH: fixtures/broken
          INPUT_FAIL-ON: broken-classical
        run: |
          if node run.mjs; then
            echo "::error::the policy gate passed a fixture full of MD5/SHA-1/RC4/3DES/TLS1.0"
            exit 1
          fi
          echo "gate correctly failed the broken fixture"

      - name: Policy gate must PASS clean crypto, including quantum-broken-but-not-classical
        env:
          INPUT_PATH: fixtures/clean
          INPUT_FAIL-ON: broken-classical
        run: |
          node run.mjs
          echo "gate correctly passed the clean fixture"
