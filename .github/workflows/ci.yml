name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch Node-runtime drift on an otherwise dormant repo

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test (152 assertions)
        run: node pqcbom.mjs
      - name: Smoke — scanner produces CBOM/SARIF artifacts (no policy gate)
        env:
          INPUT_PATH: examples
          INPUT_FAIL-ON: ""
        run: |
          node run.mjs
          test -s cbom.cdx.json
          test -s pqcbom.sarif
